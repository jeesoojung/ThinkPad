<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rentry Opener" />
    <title>Rentry Opener</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icon-512.png" />
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <h1>Rentry Opener</h1>
        <p class="subtitle">코드를 입력하면 rentry.co 페이지를 엽니다</p>
      </section>

      <form class="code-form" id="code-form">
        <label class="field">
          <span class="field-label">코드</span>
          <div class="input-row">
            <span class="prefix">rentry.co/</span>
            <input
              id="code-input"
              type="text"
              inputmode="text"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
              placeholder="aabbcc"
              aria-label="rentry 코드"
              required
            />
          </div>
        </label>

        <p class="preview" id="preview" aria-live="polite"></p>

        <div class="buttons">
          <button class="open-button" type="submit">열기</button>
          <button class="copy-button" type="button" id="copy-button">링크 복사</button>
        </div>

        <p class="error" id="error" role="alert" hidden></p>
      </form>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
